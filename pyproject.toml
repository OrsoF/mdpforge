[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpforge"
version = "0.2.0"
description = "Finite Markov decision process models, solvers, and benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0 AND GPL-2.0-only"
license-files = [
    "LICENSE",
    "src/mdpforge/models/discounted/_qvbs/_data/LICENSE",
    "src/mdpforge/models/discounted/_prism/_data/LICENSE",
    "src/mdpforge/models/discounted/_prism/_data/PRISM_COPYING.txt",
]
dependencies = ["numpy>=1.26", "scipy>=1.12", "threadpoolctl>=3.1", "matplotlib>=3.8"]

[project.optional-dependencies]
# Marmote and madupite require separate native installations.
solvers = [
    "cma>=4.4,<5",
    "mdpax>=0.2.2,<0.3",
    "mdpsolver>=0.10.2",
    "pymdptoolbox==4.0b3",
    "pyomo>=6.9,<7",
    "highspy>=1.7,<2",
    "quantecon>=0.10.1,<0.14",
]
models = ["mazelib"]

[project.urls]
Repository = "https://github.com/OrsoF/mdpforge"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["mdpforge", "mdpforge.*"]
exclude = [
    "mdpforge.models.discounted._jani._data*",
    "mdpforge.models.discounted._qvbs._data*",
    "mdpforge.models.discounted._prism._data*",
]

[tool.setuptools.package-data]
"mdpforge.models.discounted._jani" = ["_data/**/*"]
"mdpforge.models.discounted._qvbs" = ["_data/**/*"]
"mdpforge.models.discounted._prism" = ["_data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["external: integrations with external dependencies, isolated in subprocesses"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["artifacts", "studies"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# Keep concise numerical callbacks and conventional coordinate/board symbols.
ignore = ["E731", "E741"]
