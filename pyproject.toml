[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpforge"
version = "0.1.0"
description = "Finite Markov decision process models, solvers, and benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0 AND GPL-2.0-only"
license-files = [
    "LICENSE",
    "src/mdpforge/models/_qvbs_data/LICENSE",
    "src/mdpforge/models/_prism_data/LICENSE",
    "src/mdpforge/models/_prism_data/PRISM_COPYING.txt",
]
dependencies = ["numpy>=1.26", "scipy>=1.12", "threadpoolctl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10"]
plot = ["matplotlib>=3.8"]
mdptoolbox = ["pymdptoolbox==4.0b3"]
gurobi = ["gurobipy"]
mdpsolver = ["mdpsolver>=0.10.2"]
marmote = ["marmote"]
mdpax = ["mdpax>=0.2.2,<0.3"]
quantecon = ["quantecon>=0.10.1,<0.14"]
# madupite requires MPI/PETSc; install via its upstream conda/source instructions.
cma = ["cma>=4.4,<5"]
maze = ["mazelib"]
progress = ["tqdm"]
notebooks = ["mdpforge[plot]", "ipython", "pandas", "seaborn", "openpyxl"]

[project.urls]
Repository = "https://github.com/OrsoF/mdpforge"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["mdpforge", "mdpforge.*"]

[tool.setuptools.package-data]
"mdpforge.models" = [
    "_qvbs_data/*.jani", "_qvbs_data/*.json", "_qvbs_data/LICENSE",
    "_prism_data/*.nm", "_prism_data/*.json", "_prism_data/LICENSE",
    "_prism_data/PRISM_COPYING.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["external: integrations with external dependencies, isolated in subprocesses"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["artifacts", "studies"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# Keep concise numerical callbacks and conventional coordinate/board symbols.
ignore = ["E731", "E741"]
